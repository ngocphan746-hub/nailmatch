<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NailMatch Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: boss's classifieds layout — white header, soft pink-grey page, white cards, wine-red actions; results + sidebar on desktop, one column on phones */
  --primary:#9B1D4F;
  --primary-2:#7E1640;
  --tag:#FBE4EC;
  --page:#FAF6F5;
  --card:#FFFFFF;
  --line:#EFE6E8;
  --field:#DCCFD3;
  --ink:#1F1A1C;
  --muted:#5E5458;
  --self-bg:#FFF2D6;
  --self-ink:#6E5000;
  --ok-bg:#E2F2E8;
  --ok-ink:#1F6B45;
  --err:#B3261E;
  --font:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.55 var(--font)}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit}
:focus-visible{outline:3px solid #E7A3BD;outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* demo bar + header */
.demo-bar{background:var(--ink);color:#fff;font-size:13px;text-align:center;padding:6px 12px}
.site-header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hdr{display:flex;align-items:center;gap:24px;min-height:72px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;text-decoration:none;letter-spacing:-.01em}
.logo{width:40px;height:40px;border-radius:11px;background:var(--primary);display:grid;place-items:center;flex:none}
.main-nav{display:flex;gap:26px;margin:0 auto}
.main-nav a{text-decoration:none;font-weight:500;padding:6px 0;border-bottom:2px solid transparent}
.main-nav a:hover{color:var(--primary)}
.main-nav a.active{color:var(--primary);border-bottom-color:var(--primary)}
.hdr-right{display:flex;align-items:center;gap:14px;margin-left:auto}
.lang{display:inline-flex;border:1px solid var(--field);border-radius:999px;overflow:hidden}
.lang button{border:0;background:#fff;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--primary);color:#fff}
.login-link{text-decoration:none;font-weight:500}
.menu-btn{display:none;border:1px solid var(--field);background:#fff;border-radius:10px;width:44px;height:44px;align-items:center;justify-content:center;cursor:pointer}
.drawer{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;font-weight:700;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-2)}
.btn-ghost{background:#fff;border-color:var(--field);color:var(--ink)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-block{width:100%}
.btn-link{background:none;border:0;color:var(--primary);font-weight:700;cursor:pointer;padding:4px 0;text-decoration:none}
.btn-link:hover{text-decoration:underline}

/* hero + search */
.hero{background:#fff;padding:52px 0 40px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(30px,4.6vw,54px);line-height:1.08;margin:0 0 14px;letter-spacing:-.025em;font-weight:800;text-wrap:balance;max-width:20ch}
.lead{color:var(--muted);font-size:18px;margin:0 0 28px;max-width:62ch}
.band{background:#fff;border-bottom:1px solid var(--line);padding:24px 0}
.search{display:grid;grid-template-columns:1fr 1.25fr 1fr 1fr auto;gap:14px;align-items:end;background:var(--page);border:1px solid var(--line);border-radius:18px;padding:18px}
.field label,.flabel{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
input[type=text],input[type=tel],input[type=number],input[type=email],input[type=time],select,textarea{width:100%;min-height:48px;border:1px solid var(--field);border-radius:12px;padding:10px 14px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:2px solid #F3C9D9;outline-offset:0}

/* results */
.results-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;padding:32px 20px 72px}
.res-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.res-head h2{font-size:32px;margin:0;font-weight:800;letter-spacing:-.02em}
.toolbar{display:flex;gap:10px;align-items:center;padding:16px 0 6px;flex-wrap:wrap}
.cats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.cats::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--field);background:#fff;border-radius:999px;padding:0 18px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.pill:hover{border-color:var(--primary)}
.pill.on{background:var(--primary);border-color:var(--primary);color:#fff}
.count{color:var(--muted);font-size:14px;margin:6px 0 14px}
.list{display:grid;gap:16px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.ad-card{display:grid;gap:10px}
.ad-card.featured{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.ad-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--tag);color:var(--primary);font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 11px;text-transform:uppercase}
.tag.feat{background:var(--primary);color:#fff}
.loc{color:var(--muted);font-size:14px;display:inline-flex;gap:6px;align-items:center}
.ad-title{font-size:20px;font-weight:800;margin:0;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.ad-title a{text-decoration:none}
.ad-title a:hover{color:var(--primary)}
.biz{font-weight:600;color:var(--muted);font-size:15px;margin:0}
.meta{margin:0;color:var(--muted);font-size:15px}
.desc{margin:0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.svc{font-size:13px;border-radius:999px;padding:3px 10px;border:1.5px solid var(--primary);font-weight:700;line-height:1.5}
.svc.must,.svc.lv-very_good{background:var(--primary);color:#fff}
.svc.plus,.svc.lv-good{background:#fff;color:var(--primary)}
.svc.lv-learning{background:#fff;color:var(--muted);border-color:var(--field);border-style:dashed}
.svc.plain{background:var(--page);color:var(--ink);border-color:var(--line)}
.chip-more{font-size:13px;color:var(--muted);align-self:center;font-weight:600}
.ad-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px;margin-top:2px}
.pay{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.pay.muted{color:var(--muted);font-weight:600}
.posted{font-size:13px;color:var(--muted)}
.self{background:var(--self-bg);color:var(--self-ink);font-size:12px;padding:2px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:999px;border:1.5px solid var(--primary);display:inline-block}
.dot.f{background:var(--primary)}
.empty{text-align:center;padding:36px 22px}
.empty h3{margin:0 0 6px;font-size:20px}
.empty p{margin:0 0 16px;color:var(--muted)}

/* sidebar */
.side{display:grid;gap:18px;align-content:start}
.side h3{margin:0 0 8px;font-size:20px;font-weight:800}
.side p{margin:0 0 16px;color:var(--muted)}
.link-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.link-grid.three{grid-template-columns:repeat(3,1fr)}
.link-grid button{background:none;border:0;padding:4px 0;color:var(--primary);font-weight:600;text-align:left;cursor:pointer}
.link-grid button:hover{text-decoration:underline}
.link-grid button.cur{color:var(--ink);font-weight:800}
.sponsor{background:var(--tag);border-color:transparent}
.sponsor .small{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin:0 0 6px}

/* detail */
.detail{padding:24px 20px 80px}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:600;margin-bottom:16px}
.back:hover{color:var(--primary)}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.stack{display:grid;gap:16px}
.detail h1{font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:8px 0 6px;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.card h2{font-size:19px;margin:0 0 14px;font-weight:800}
.kv{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:12px 18px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.ns{color:var(--muted);font-weight:400;font-style:italic}
.req-group{display:grid;gap:8px;margin-bottom:14px}
.req-group:last-child{margin-bottom:0}
.req-label{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.contact-card{position:sticky;top:96px;display:grid;gap:12px}
.phone-big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.note{font-size:13px;color:var(--muted);margin:0}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ph{aspect-ratio:1/1;border-radius:12px;background:linear-gradient(140deg,var(--a),var(--b));display:flex;flex-direction:column;justify-content:space-between;padding:8px;color:#fff;font-size:12px;font-weight:700;position:relative;overflow:hidden}
.ph::before{content:"";position:absolute;left:50%;top:22%;width:30%;height:44%;transform:translateX(-50%);border-radius:50% 50% 40% 40%/60% 60% 40% 40%;background:rgba(255,255,255,.35);box-shadow:-34px 10px 0 -4px rgba(255,255,255,.22),34px 10px 0 -4px rgba(255,255,255,.22)}
.ph span{position:relative;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.ph small{position:relative;font-weight:600;opacity:.85}
.photos img{aspect-ratio:1/1;object-fit:cover;border-radius:12px;width:100%}

/* page heads */
.page-head{padding:36px 20px 8px}
.page-head h1{font-size:clamp(28px,3.6vw,40px);margin:0 0 6px;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.page-head p{margin:0;color:var(--muted);max-width:62ch}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.badge-hiring{background:var(--ok-bg);color:var(--ok-ink);font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;text-decoration:none;white-space:nowrap}
.dir-tools{display:grid;grid-template-columns:1fr 240px;gap:12px;margin:18px 0}

/* prices */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px 0 72px}
.plan{display:grid;gap:12px;align-content:start}
.plan.hl{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.plan h2{margin:0;font-size:20px}
.price{font-size:30px;font-weight:800;letter-spacing:-.02em}
.price small{font-size:15px;color:var(--muted);font-weight:600}
.plan ul{margin:0;padding-left:20px;display:grid;gap:6px}

/* post choose */
.choose{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:20px 0 72px}
.choose a{text-decoration:none;display:grid;gap:6px}
.choose a:hover{border-color:var(--primary)}
.choose strong{font-size:19px}
.choose span{color:var(--muted)}

/* forms */
.form-wrap{max-width:760px;margin:0 auto;padding:28px 20px 110px}
.form-wrap h1{font-size:clamp(26px,3.4vw,34px);margin:0 0 14px;letter-spacing:-.02em;font-weight:800}
.steps{display:flex;gap:8px;margin-bottom:8px}
.step{flex:1;height:6px;border-radius:999px;background:var(--line)}
.step.on{background:var(--primary)}
.step-label{color:var(--muted);font-weight:600;margin:0 0 16px}
.form-card{display:grid;gap:26px}
.fq .flabel{font-size:16px}
.req{color:var(--primary)}
.opt{color:var(--muted);font-weight:500;font-size:13px}
.hint{font-size:14px;color:var(--muted);margin:-2px 0 8px}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1.5px solid var(--field);background:#fff;border-radius:999px;padding:0 15px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px;color:var(--ink)}
.choice:hover{border-color:var(--primary)}
.choice.on,.choice.must,.choice.lv-very_good{background:var(--primary);color:#fff;border-color:var(--primary)}
.choice.plus,.choice.lv-good{background:var(--tag);color:var(--primary);border-color:var(--primary)}
.choice.lv-learning{background:#fff;color:var(--primary);border-color:var(--primary);border-style:dashed}
.choice em{font-style:normal;font-weight:800}
.affix{display:flex;align-items:center;gap:8px;max-width:260px}
.affix b{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--field);border-radius:12px;overflow:hidden;background:#fff}
.stepper button{width:46px;height:46px;border:0;background:#fff;font-size:22px;font-weight:700;cursor:pointer;color:var(--primary)}
.stepper output{min-width:46px;text-align:center;font-weight:800}
.err{color:var(--err);font-size:14px;font-weight:600;margin:6px 0 0}
.fq.has-err input,.fq.has-err select,.fq.has-err textarea{border-color:var(--err)}
.counter{font-size:13px;color:var(--muted);text-align:right;margin:4px 0 0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--primary);flex:none}
.form-nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
.thumb{position:relative}
.thumb img{aspect-ratio:1/1;object-fit:cover;border-radius:10px;width:100%}
.thumb button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:999px;border:0;background:rgba(31,26,28,.75);color:#fff;cursor:pointer;font-weight:800}
.file-btn{display:inline-flex}
.file-btn input{position:absolute;opacity:0;width:1px;height:1px}
.done{text-align:center;display:grid;gap:10px;justify-items:center}
.done .ok{width:56px;height:56px;border-radius:999px;background:var(--ok-bg);color:var(--ok-ink);display:grid;place-items:center}
.done h2{margin:0;font-size:26px}
.done p{margin:0;color:var(--muted)}

/* modal + toast */
#modal-root:empty{display:none}
.modal-bg{position:fixed;inset:0;background:rgba(31,26,28,.48);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal{background:#fff;border-radius:20px;max-width:580px;width:100%;max-height:88vh;overflow:auto;padding:22px 22px 18px;display:grid;gap:18px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-head h2{margin:0;font-size:21px}
.x{border:0;background:var(--page);border-radius:999px;width:40px;height:40px;cursor:pointer;font-size:20px;font-weight:700}
.modal-foot{display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:-18px;background:#fff;padding:12px 0 4px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;max-width:min(92vw,520px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast[hidden]{display:none}

/* footer + mobile bar */
.site-footer{border-top:1px solid var(--line);background:#fff;padding:22px 0;color:var(--muted);font-size:14px}
.site-footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mbar{display:none}

/* matching */
.mlabel{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:4px 11px;white-space:nowrap}
.ml-strong{background:var(--ok-bg);color:var(--ok-ink)}
.ml-good{background:var(--tag);color:var(--primary)}
.ml-partial{background:#FFF0D2;color:#6E4C00}
.ml-low{background:#EFEAEC;color:var(--muted)}
.ml-insufficient{background:#fff;color:var(--muted);border:1px dashed var(--field)}
.ml-fail{background:#FBE3E1;color:#8E2620}
.reasons{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.reasons li{display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:15px;align-items:start}
.reasons li::before{font-weight:800;text-align:center}
.reasons .ok::before{content:"✓";color:var(--ok-ink)}
.reasons .mid::before{content:"~";color:#6E4C00}
.reasons .no::before{content:"✕";color:#8E2620}
.reasons .unk::before{content:"?";color:var(--muted)}
.reasons .neu::before{content:"–";color:var(--muted)}
.reasons .neu{color:var(--muted)}
.fit-fail{background:#FBE3E1;color:#8E2620}
.why summary{cursor:pointer;color:var(--primary);font-weight:700;font-size:14px}
.why .tbl{overflow-x:auto}
.why table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.why th,.why td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.why th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.why .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.why p{margin:8px 0 0;font-size:13px;color:var(--muted)}
.wbars{display:grid;gap:10px;margin-top:14px}
.wbar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:14px}
.wbar b{font-variant-numeric:tabular-nums}
.wbar .bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.wbar .bar i{display:block;height:100%;background:var(--primary)}
.pick{display:grid;gap:14px;margin:16px 0 8px}
.section-title{font-size:22px;font-weight:800;margin:10px 0 12px;letter-spacing:-.01em}
/* portfolio */
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pf-item{display:grid;gap:6px;margin:0;align-content:start}
.pf-item img{aspect-ratio:1/1;object-fit:cover;border-radius:12px;width:100%}
.pf-item figcaption{font-size:14px;line-height:1.4}
.pf-item figcaption b{display:block;font-size:12px;color:var(--primary);text-transform:uppercase;letter-spacing:.04em}
.pf-note{font-size:13px;color:var(--muted);margin:0 0 12px}
/* writer + builder */
.assist{background:#FFF8FB;border:1.5px dashed var(--primary);border-radius:16px;padding:18px;display:grid;gap:10px;margin-bottom:16px}
.assist h2{margin:0;font-size:19px}
.demo-tag{font-size:12px;font-weight:700;color:var(--self-ink);background:var(--self-bg);border-radius:999px;padding:2px 9px;justify-self:start}
.ex{border:1px solid var(--field);background:#fff;border-radius:10px;padding:9px 12px;text-align:left;cursor:pointer;font-size:14px;color:var(--ink);line-height:1.4}
.ex:hover{border-color:var(--primary)}
.assist-out{display:grid;gap:6px;font-size:15px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.assist-out .miss{color:#6E4C00;font-weight:600}
.pb-list{display:grid;gap:10px;margin-top:12px}
.pb-row{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px;position:relative}
.pb-row img{width:96px;height:96px;object-fit:cover;border-radius:10px}
.pb-row .x2{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:999px;border:0;background:var(--page);cursor:pointer;font-weight:800}
.pb-fields{display:grid;gap:6px;padding-right:38px}
.pb-fields label{font-size:13px;font-weight:700}
.pb-fields select,.pb-fields input{min-height:42px;font-size:15px}
.qc{font-size:13px;margin:0;font-weight:600}
.qc.okc{color:var(--ok-ink)}
.qc.warn{color:#6E4C00}

  if (shape === 'almond') return `<path d="M${x} ${y + h} L${x} ${y + h * 0.45} Q${x} ${y} ${x + w / 2} ${y - 2} Q${x + w} ${y} ${x + w} ${y + h * 0.45} L${x + w} ${y + h} Z"/>`;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${shape === 'square' ? 2 : 6}"/>`;
}
function svcArt(id){
  if (SVC_PHOTO[id]) return `<span class="ph-wrap"><img src="${SVC_PHOTO[id]}" alt="${esc(svcName(id))}" loading="lazy"><span class="ph-lab">${esc(t('exampleImg'))}</span></span>`;
  const a = ART[id] || {bg:'#EEE', nail:'#C2416F', len:14, shape:'round'};
  const u = 'og' + (++artUid);
  let body = '';
  if (a.special === 'foot'){
    body = `<path d="M36 92 C28 66 36 40 58 36 C82 32 92 56 88 92 Z" fill="#F2CDB5"/>` +
      [[42,38,7],[55,30,6.2],[67,29,5.6],[78,32,5],[87,38,4.4]].map(([cx, cy, r]) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#F2CDB5"/><ellipse cx="${cx}" cy="${cy - 1}" rx="${(r * 0.62).toFixed(1)}" ry="${(r * 0.55).toFixed(1)}" fill="${a.nail}"/>`).join('');
  } else if (a.special === 'wax'){
    body = `<g transform="rotate(-12 50 48)"><rect x="18" y="36" width="64" height="24" rx="4" fill="#FFFFFF" stroke="#D9B26F"/><rect x="24" y="41" width="52" height="14" rx="3" fill="#E9B95C" opacity=".65"/></g>
      <rect x="86" y="58" width="24" height="7" rx="3" fill="#8E5F1B"/><path d="M88 65 h20 v16 a5 5 0 0 1 -5 5 h-10 a5 5 0 0 1 -5 -5z" fill="#C98A2E"/>`;
  } else if (a.special === 'eye'){
    const lid = x => 52 - Math.sin((x - 22) / 76 * Math.PI) * 22;
    body = `<path d="M22 52 Q60 8 98 52" fill="none" stroke="#3B2F33" stroke-width="3" stroke-linecap="round"/><path d="M26 52 Q60 72 94 52 Q60 30 26 52 Z" fill="#FFFFFF" stroke="#3B2F33" stroke-width="1.4"/><circle cx="60" cy="53" r="9" fill="#5A4048"/><circle cx="57" cy="50" r="2.2" fill="#fff"/>` +
      [28,36,44,52,60,68,76,84,92].map((x, i) => `<line x1="${x}" y1="${lid(x).toFixed(1)}" x2="${(x - 6 + i * 1.5).toFixed(1)}" y2="${(lid(x) - 12).toFixed(1)}" stroke="#3B2F33" stroke-width="1.6" stroke-linecap="round"/>`).join('');
  } else {
    const fingers = [[24,42],[42,32],[60,30],[78,38]], ext = a.len * 0.7;
    const fill = a.ombre ? `url(#${u})` : a.nail;
    body = a.ombre ? `<defs><linearGradient id="${u}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${a.nail}"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient></defs>` : '';
    body += fingers.map(([fx, ft]) => {
      const nx = fx + 2.5, nw = 13, ny = ft - ext + 4, nh = ext + 12;
      let n = `<rect x="${fx}" y="${ft}" width="18" height="${100 - ft}" rx="9" fill="#F2CDB5"/>`;
      n += `<g fill="${fill}"${a.stroke ? ` stroke="${a.stroke}" stroke-width="1"` : ''}>${nailPath(nx, ny, nw, nh, a.shape)}</g>`;
      if (a.tip && !a.ombre) n += `<rect x="${nx}" y="${ny}" width="${nw}" height="${Math.max(5, nh * 0.28).toFixed(1)}" rx="2" fill="${a.tip}"/>`;
      if (a.fill) n += `<rect x="${nx}" y="${(ny + nh * 0.6).toFixed(1)}" width="${nw}" height="${(nh * 0.4).toFixed(1)}" fill="#F6D7C6"/><line x1="${nx}" x2="${nx + nw}" y1="${(ny + nh * 0.6).toFixed(1)}" y2="${(ny + nh * 0.6).toFixed(1)}" stroke="#fff" stroke-width="1.2"/>`;
      if (a.shine) n += `<rect x="${nx + 2.5}" y="${ny + 3}" width="3" height="${(nh * 0.45).toFixed(1)}" rx="1.5" fill="#fff" opacity=".55"/>`;
      if (a.dots) n += [['#C2416F', 0.3], ['#3F8C6E', 0.55], ['#B8913A', 0.78]].map(([c, q]) => `<circle cx="${nx + nw / 2}" cy="${(ny + nh * q).toFixed(1)}" r="1.8" fill="${c}"/>`).join('');
      if (a.flower){ const cx = nx + nw / 2, cy = ny + nh * 0.42; n += [0,72,144,216,288].map(dg => `<circle cx="${(cx + 3 * Math.cos(dg * Math.PI / 180)).toFixed(1)}" cy="${(cy + 3 * Math.sin(dg * Math.PI / 180)).toFixed(1)}" r="2.2" fill="#E07A9A"/>`).join('') + `<circle cx="${cx}" cy="${cy.toFixed(1)}" r="1.6" fill="#E9B95C"/>`; }
      return n;
    }).join('');
    if (a.jar) body += `<rect x="100" y="60" width="15" height="24" rx="4" fill="#FFFFFF" stroke="#7F4FA8"/><rect x="100" y="68" width="15" height="16" rx="3" fill="${a.nail}" opacity=".7"/><rect x="98" y="55" width="19" height="7" rx="2" fill="#5E3B7E"/>`;
  }
  const lab = t('exampleImg'), lw = (lab.length * 4.4 + 10).toFixed(0);
  return `<svg viewBox="0 0 120 92" role="img" aria-label="${esc(lab)}: ${esc(svcName(id))}"><rect width="120" height="92" fill="${a.bg}"/>${body}<rect x="4" y="77" width="${lw}" height="11" rx="5.5" fill="rgba(255,255,255,.88)"/><text x="9" y="85.2" font-size="7.5" font-weight="700" fill="#5E5458" font-family="Be Vietnam Pro, system-ui, sans-serif">${esc(lab)}</text></svg>`;
}

const LV_ORDER = {very_good:0, good:1, learning:2};
function portfolioOf(tc){
  if (tc.portfolio) return tc.portfolio;
  const svcs = tc.services.slice().sort((a, b) => LV_ORDER[a.level] - LV_ORDER[b.level]).map(s => s.id).filter(id => CAPS[id]);
  const used = {}, items = [];
  /* round-robin over the tech's services, never repeating a sample photo */
  for (let round = 0; items.length < (tc.photos || 0) && round < 6; round++){
    svcs.forEach(id => {
      if (items.length >= (tc.photos || 0)) return;
      const k = used[id] || 0;
      if (PF_COUNT[id] && k >= PF_COUNT[id]) return;
      used[id] = k + 1;
      const caps = PF_CAPS[id] || CAPS[id];
      items.push({svc:id, cap:caps[k % caps.length], i:items.length, img:pfPhoto(id, k)});
    });
  }
  return items;
}

/* ---------- matching (rules only, no AI): each requirement is a match / no match / unknown ---------- */
const YEARS_NUM = {new:0, lt1:0.5, '1_3':2, '3_5':4, '5p':6};
const EXP_MIN = {any:0, new_ok:0, '1':1, '3':3, '5':5};
function zipDist(a, b, ca, cb){ const p = coordsOf(a, ca), q = coordsOf(b, cb); if (!p || !q) return null; return Math.round(hav(p[0], p[1], q[0], q[1])); }
function jobFits(adJt, techJts){ return techJts.includes(adJt) || (adJt === 'weekends' && techJts.includes('part_time')) || (adJt === 'part_time' && techJts.includes('weekends')); }
function matchPair(ad, tc){
  const h = ad.hiring, items = [];
  let fail = false;
  const add = (ok, label, why, text) => items.push({ok, s:label, why:why || '', text:text || label});
  const tsv = id => tc.services.find(s => s.id === id);
  h.services.slice().sort((a, b) => (a.need === 'must' ? 0 : 1) - (b.need === 'must' ? 0 : 1)).forEach(s => {
    const has = !!tsv(s.id);
    if (s.need === 'must'){ add(has, svcShort(s.id), has ? '' : t('w_noSvc'), svcName(s.id)); if (!has) fail = true; }
    else items.push({ok: has ? true : null, plus:true, s:svcShort(s.id), text:svcName(s.id)});
  });
  if (h.license === 'required'){ const ok = tc.license ? tc.license === 'have' : null; add(ok, t('r_lic'), ok === false ? t('w_noLic') : ok === null ? t('w_notSaid') : ''); if (ok === false) fail = true; }
  if (h.jobType){ const has = tc.jobType && tc.jobType.length; const ok = has ? jobFits(h.jobType, tc.jobType) : null;
    add(ok, opt('jobType', h.jobType), ok === false ? t('w_wants', tc.jobType.map(j => opt('jobType', j)).join(' / ')) : ok === null ? t('w_notSaid') : ''); }
  if (h.experience && EXP_MIN[h.experience] > 0){ const ok = tc.years ? YEARS_NUM[tc.years] >= EXP_MIN[h.experience] : null;
    add(ok, opt('experience', h.experience), ok === false ? t('w_has', opt('years', tc.years)) : ok === null ? t('w_notSaid') : ''); }
  if (h.days && h.days.length){
    if (!tc.days || !tc.days.length) add(null, t('r_days'), t('w_notSaid'));
    else { const ov = h.days.filter(x => tc.days.includes(x)).length, ok = ov === h.days.length; add(ok, t('r_days'), ok ? '' : t('w_days', ov, h.days.length)); }
  }
  if (h.payType){
    const lab = `${t('r_pay')} ${payText(h) || opt('payType', h.payType)}`, pw = tc.payWanted;
    if (!pw) add(null, lab, t('w_notSaid'));
    else {
      const same = pw.type === h.payType || (pw.type.startsWith('commission') && h.payType.startsWith('commission'));
      const ok = same && (!pw.pct || !h.commissionPct || h.commissionPct >= pw.pct) && (!pw.amount || !h.amount || h.amount >= pw.amount);
      add(ok, lab, ok ? '' : t('w_wants', techPay(pw)));
    }
  }
  const d = zipDist(ad.zip, tc.zip, ad.city, tc.city), tr = Number(tc.travel) || null;
  if (d === null) add(null, t('r_dist'), t('w_noZip'));
  else if (!tr) add(null, `${d} ${t('milesS')}`, t('w_notSaid'));
  else add(d <= tr, `${d} ${t('milesS')}`, d <= tr ? '' : t('w_far', d, tr));
  const scored = items.filter(i => !i.plus), known = scored.filter(i => i.ok !== null), okN = known.filter(i => i.ok).length;
  return {pct: known.length ? Math.round(okN / known.length * 100) : null, items, okN, known:known.length, total:scored.length, unknown:scored.length - known.length, fail, dist:d};
}
/* candidates meeting every must-have come first; within each group, higher match % first */
const byMatch = (a, b) => ((a.m.fail ? 1 : 0) - (b.m.fail ? 1 : 0)) || ((b.m.pct == null ? -1 : b.m.pct) - (a.m.pct == null ? -1 : a.m.pct)) || (b.m.known - a.m.known);
function matchesForAd(ad){ return TECHS.map(tc => ({o:tc, m:matchPair(ad, tc)})).sort(byMatch); }
function matchesForTech(tc){ return ADS.filter(a => a.type === 'hiring').map(ad => ({o:ad, m:matchPair(ad, tc)})).sort(byMatch); }

function norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
function cityOf(zip){ return ZIPS[zip] ? ZIPS[zip][2] : ''; }
function hav(a, b, c, d){ const R = 3958.8, r = x => x * Math.PI / 180; const dl = r(c - a), dn = r(d - b);
  const h = Math.sin(dl/2)**2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dn/2)**2; return 2 * R * Math.asin(Math.sqrt(h)); }
function coordsOf(zip, city){ const z = ZIPS[zip]; if (z) return z; const c = CITIES[city]; return c ? [c[0], c[1], city] : null; }
function dist(zip, city){ const p = coordsOf(zip, city); if (!p || !state.center) return null; return Math.round(hav(state.center.lat, state.center.lng, p[0], p[1])); }

function postedText(n){ return n === 0 ? t('today') : n === 1 ? t('yesterday') : t('daysAgo', n); }
function fmtTime(v){ if (!v) return ''; if (lang === 'vi') return v; const [h, m] = v.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; return `${((h + 11) % 12) + 1}:${String(m).padStart(2,'0')} ${ap}`; }
function daysText(arr){ if (!arr || !arr.length) return ''; return OPTS.days.filter(d => arr.includes(d.v)).map(d => L(d)).join(', '); }

function payText(p){
  if (!p || !p.payType) return '';
  const vi = lang === 'vi';

function matchCard(m, kind, obj){

function analyze(url){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas'), x = c.getContext('2d');
        c.width = 32; c.height = 32; x.drawImage(img, 0, 0, 32, 32);
        const a = x.getImageData(0, 0, 32, 32).data; let sum = 0;
        for (let i = 0; i < a.length; i += 4) sum += 0.299 * a[i] + 0.587 * a[i + 1] + 0.114 * a[i + 2];
        c.width = 8; c.height = 8; x.drawImage(img, 0, 0, 8, 8);
        const e = x.getImageData(0, 0, 8, 8).data, v = [];
        for (let i = 0; i < e.length; i += 4) v.push(0.299 * e[i] + 0.587 * e[i + 1] + 0.114 * e[i + 2]);
        const mean = v.reduce((p, q) => p + q, 0) / v.length;
        res({w:img.naturalWidth, h:img.naturalHeight, avg:sum / 1024, hash:v.map(q => q > mean ? 1 : 0).join('')});
      } catch (err) { res(null); }
    };
    img.onerror = () => res(null);
    img.src = url;
  });
}
function ham(a, b){ let n = 0; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) n++; return n; }
async function runQC(type){
  const fs = getForm(type);

  fs.data.photos.forEach((p, i) => {
    const q = [];
    if (p.info){
      if (p.info.avg < 55) q.push({k:'pbDark'});
      if (Math.max(p.info.w, p.info.h) < 600) q.push({k:'pbSmall'});
      for (let j = 0; j < i; j++){ const o = fs.data.photos[j].info; if (o && ham(o.hash, p.info.hash) <= 3){ q.push({k:'pbDup', n:j + 1}); break; } }
    }
    p.qc = q;
  });
  const r = route();
  if (r.view === 'form' && r.type === type){
    const a = document.activeElement, keep = a && a.id;
    render();
    if (keep){ const el = document.getElementById(keep); if (el) el.focus(); }
  }
}

  if (d.days && d.days.length) bits.push(vi ? `Rảnh: ${daysText(d.days)}.` : `Available: ${daysText(d.days)}.`);
  if (d.city) bits.push(vi ? `Ở ${d.city}${d.travel ? `, đi làm tối đa ${d.travel} dặm` : ''}.` : `Based in ${d.city}${d.travel ? `, will travel up to ${d.travel} miles` : ''}.`);
  return bits.join(' ').slice(0, 300);
}

/* ---------- layout + routing ---------- */
function route(){
  let h = (location.hash || '').replace(/^#/, '') || 'home';
  if (['directory','contact','login','prices','services','for-sale','matching'].includes(h)) h = 'home';
  if (h.startsWith('ad-')) return {view:'ad', id:h.slice(3)};
  if (h.startsWith('tech-')) return {view:'tech', id:h.slice(5)};
  if (h.startsWith('portfolio-')) return {view:'portfolio', id:h.slice(10)};
  if (h.startsWith('post-')) return {view:'form', type:{'post-hiring':'hiring','post-profile':'profile','post-sale':'sale','post-service':'service'}[h] || null};
  return {view:h};
}
function header(r){

function render(){
  const r = route();
  let main;
  switch (r.view){
    case 'home': main = viewHome(); break;
    case 'ads': main = viewAds(); break;
    case 'ad': main = viewAd(r.id); break;
    case 'job-seekers': main = viewSeekers(); break;
    case 'tech': main = viewTech(r.id); break;
    case 'portfolio': main = viewPortfolio(r.id); break;

/* ---------- actions ---------- */
function doSearch(){
  const st = document.getElementById('s-state').value;
  const city = document.getElementById('s-city').value.trim();
  const zip = document.getElementById('s-zip').value.trim();
  const within = Number(document.getElementById('s-within').value);
  state.search = {st, city, zip, within};
  if (st !== 'TX') state.center = null;
  else if (ZIPS[zip]) state.center = {lat:ZIPS[zip][0], lng:ZIPS[zip][1], name:`${ZIPS[zip][2]} ${zip}`};
  else {
    const key = Object.keys(CITIES).find(c => norm(c) === norm(city || 'San Antonio'));
    state.center = key ? {lat:CITIES[key][0], lng:CITIES[key][1], name:key} : null;
  }
  goResults();
}

  const r = route();
  if (r.view === 'home' || r.view === 'ads'){ render(); const el = document.getElementById('results'); if (el && r.view === 'home') el.scrollIntoView({block:'start'}); }
  else location.hash = 'ads';

  const el = e.target;
  if (el.dataset.act === 'fcheck') return ACT.fcheck(el);
  if (el.dataset.act === 'tfcheck') return ACT.tfcheck(el);
  if (el.type === 'file' && el.dataset.fk === 'photos'){
    const type = el.dataset.ft, fs = getForm(type);
    const f = FORMS[type].steps.flatMap(s => s.fields).find(x => x.k === 'photos');
    const files = Array.from(el.files || []).filter(x => /^image\//.test(x.type)).slice(0, f.max - fs.data.photos.length);
    const start = fs.data.photos.length;
    files.forEach((file, j) => {
      const p = {url:URL.createObjectURL(file)};
      if (f.type === 'portfolio'){ const sg = suggestFor(fs, start + j); p.svc = sg.svc; p.cap = sg.cap; p.svcSuggested = !!sg.svc; p.capSuggested = !!sg.cap; p.qc = null; }
      fs.data.photos.push(p);
    });
    render();
    if (f.type === 'portfolio') runQC(type);
    return;
  }
  if (el.dataset.pm){
    const m = state.pm;
    if (el.dataset.pm === 'file'){ const f = el.files && el.files[0]; if (f && /^image\//.test(f.type)){ m.url = URL.createObjectURL(f); m.err = false; } renderModal(); return; }
    if (el.dataset.pm === 'consent'){ m.consent = el.checked; return; }
    m[el.dataset.pm] = el.value; return;
  }
  if (el.dataset.fk === 'rvstars'){ getForm(el.dataset.ft).data.reviews[Number(el.dataset.i)].stars = Number(el.value); return; }
  if (el.dataset.q){
    if (el.dataset.q === 'city'){ const c = el.value; state.search.city = c; state.search.zip = ''; state.center = {lat:CITIES[c][0], lng:CITIES[c][1], name:c}; }
    else state.search.within = Number(el.value);
    render(); return;
  }
  if (el.dataset.mpick){ if (el.dataset.mpick === 'ad') state.match.adId = el.value; else state.match.techId = el.value; render(); return; }
  if (el.dataset.fk === 'psvc'){
    const fs = getForm(el.dataset.ft), p = fs.data.photos[Number(el.dataset.i)];
    p.svc = el.value; p.svcSuggested = false;
    if (p.capSuggested || !p.cap){ p.cap = suggestCap(p.svc, 0); p.capSuggested = !!p.cap; }
    render(); return;
  }
  if (el.dataset.dir){ state.dir[el.dataset.dir] = el.value; document.getElementById('dir-list').innerHTML = dirList(); return; }
  if (el.dataset.al){ state.alert[el.dataset.al] = el.value; return; }
  if (el.dataset.fk && el.tagName === 'SELECT'){ const fs = getForm(el.dataset.ft); fs.data[el.dataset.fk] = el.value; delete fs.errors[el.dataset.fk]; }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.dir === 'q'){ state.dir.q = el.value; document.getElementById('dir-list').innerHTML = dirList(); return; }
  if (el.dataset.al === 'contact'){ state.alert.contact = el.value; return; }
  if (el.dataset.assist){ getForm('hiring').assist.text = el.value; return; }
  if (el.dataset.pm && el.dataset.pm !== 'file' && el.dataset.pm !== 'consent'){ state.pm[el.dataset.pm] = el.value; return; }
  if (el.dataset.fk === 'rvname' || el.dataset.fk === 'rvtext'){ getForm(el.dataset.ft).data.reviews[Number(el.dataset.i)][el.dataset.fk === 'rvname' ? 'name' : 'text'] = el.value; return; }
  if (el.dataset.fk === 'rvstars') return;
  if (el.dataset.mpick || el.dataset.q || el.dataset.fk === 'psvc') return;
  if (el.dataset.fk === 'pcap'){ const p = getForm(el.dataset.ft).data.photos[Number(el.dataset.i)]; p.cap = el.value; p.capSuggested = false; return; }
  if (!el.dataset.fk || !el.dataset.ft || el.type === 'file' || el.type === 'checkbox') return;
  const fs = getForm(el.dataset.ft), k = el.dataset.fk;
  if (k === 'hours'){ const h = fs.data.hours || ['', '']; h[Number(el.dataset.i)] = el.value; fs.data.hours = h; return; }
  fs.data[k] = el.value;
  if (k === 'title') fs.titleEdited = true;
  if (fs.errors[k]){ delete fs.errors[k]; const q = el.closest('.fq'); if (q){ q.classList.remove('has-err'); const er = q.querySelector('.err'); if (er) er.remove(); } }
  const c = document.getElementById(el.id + '-c'); if (c) c.textContent = `${el.value.length}/${el.maxLength}`;
});
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  if (kind === 'search') return doSearch();
  if (kind === 'contact'){ form.reset(); toast(t('demoNotSaved')); return; }
  if (kind === 'login'){
    const p = document.getElementById('lg-phone').value;
    if (!state.login.sent){
      if (p.replace(/\D/g, '').length < 10){ const q = document.getElementById('lg-phone-q'); q.classList.add('has-err'); if (!q.querySelector('.err')) q.insertAdjacentHTML('beforeend', `<p class="err">${t('errPhone')}</p>`); return; }
      state.login = {phone:p, sent:true}; render(); const c = document.getElementById('lg-code'); if (c) c.focus(); return;
    }
    state.login = {phone:'', sent:false}; toast(t('demoNotSaved')); location.hash = 'home';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.modal) closeModal(); });
window.addEventListener('hashchange', () => { state.menu = false; state.modal = null; render(); window.scrollTo(0, 0); });

render();
})();
</script>
</body>
</html>
